# Builds an installable APK for version tags (vX.Y.Z) and manual runs.
# Pushes, pull requests, and schedules do not start this workflow.
name: Release APK

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: mantel-crm-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android SDK
        run: |
          set -euo pipefail
          SDK="$HOME/android-sdk"
          mkdir -p "$SDK/cmdline-tools"
          curl -fsSL -o /tmp/cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          rm -rf /tmp/cmdtools
          unzip -q /tmp/cmdtools.zip -d /tmp/cmdtools
          rm -rf "$SDK/cmdline-tools/latest"
          mv /tmp/cmdtools/cmdline-tools "$SDK/cmdline-tools/latest"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - name: Select signing key
        env:
          KEYSTORE_B64: ${{ secrets.CROMAN_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.CROMAN_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.CROMAN_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.CROMAN_KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [ -n "${KEYSTORE_B64}" ] && [ -n "${STORE_PASSWORD}" ] && [ -n "${KEY_PASSWORD}" ] && [ -n "${KEY_ALIAS}" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/croman-release.keystore"
            echo "CROMAN_KEYSTORE=$RUNNER_TEMP/croman-release.keystore" >> "$GITHUB_ENV"
            echo "CROMAN_STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "CROMAN_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "CROMAN_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          else
            test -f signing/croman-test.keystore
            echo "Using the committed test keystore. No secret keystore is configured."
          fi

      - name: Test
        run: |
          set -euo pipefail
          python3 scripts/ftl-matrix.py --self-check
          python3 scripts/ftl_outcome.py --self-check
          python3 scripts/pick-emulator-image.py --self-check
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          ./gradlew test lintDebug --stacktrace --no-daemon

      - name: Build debug APK and instrumented tests
        run: |
          set -euo pipefail
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          ./gradlew assembleDebug assembleDebugAndroidTest --stacktrace --no-daemon

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: croman-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          retention-days: 7

  emulator:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 70
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - api: 23
            locales: en
            label: api23-en
            image: google_apis
          - api: 30
            locales: en ru iw
            label: api30-en-ru-iw
            image: default
          - api: 36
            locales: en ru iw
            label: api36-en-ru-iw
            image: google_apis
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Install Android SDK
        run: |
          set -euo pipefail
          SDK="$HOME/android-sdk"
          mkdir -p "$SDK/cmdline-tools"
          curl -fsSL -o /tmp/cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          rm -rf /tmp/cmdtools
          unzip -q /tmp/cmdtools.zip -d /tmp/cmdtools
          rm -rf "$SDK/cmdline-tools/latest"
          mv /tmp/cmdtools/cmdline-tools "$SDK/cmdline-tools/latest"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true

      - name: Choose system image
        id: image
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --list > "$RUNNER_TEMP/sdk-packages.txt"
          IFS=$'\t' read -r API TARGET NOTE < <(python3 scripts/pick-emulator-image.py "${{ matrix.api }}" "$RUNNER_TEMP/sdk-packages.txt" "${{ matrix.image }}")
          echo "api=$API" >> "$GITHUB_OUTPUT"
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"
          if [ -z "$NOTE" ]; then NOTE="exact"; fi
          echo "note=$NOTE" >> "$GITHUB_OUTPUT"
          echo "System image: API $API $TARGET x86_64 ($NOTE)" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Cache AVD snapshot
        id: avd-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.ANDROID_HOME }}/system-images
          key: system-image-${{ steps.image.outputs.api }}-${{ steps.image.outputs.target }}-x86_64

      - name: Download APKs
        uses: actions/download-artifact@v4
        with:
          name: croman-apk
          path: dist

      - name: Write emulator job env
        run: |
          set -euo pipefail
          APP_APK=$(find "$GITHUB_WORKSPACE/dist" -type f -name 'app-debug.apk' | head -n 1)
          TEST_APK=$(find "$GITHUB_WORKSPACE/dist" -type f -name 'app-debug-androidTest.apk' | head -n 1)
          test -n "$APP_APK"
          test -n "$TEST_APK"
          cat > "$GITHUB_WORKSPACE/emulator-job.env" <<EOF
          CROMAN_APK=$APP_APK
          CROMAN_TEST_APK=$TEST_APK
          CROMAN_LOCALES='${{ matrix.locales }}'
          CROMAN_API=${{ steps.image.outputs.api }}
          CROMAN_IMAGE_NOTE='${{ steps.image.outputs.note }}'
          CROMAN_RESULTS=$GITHUB_WORKSPACE/device-results
          EOF
          echo "App: $APP_APK"
          echo "Tests: $TEST_APK"

      - name: Boot emulator and test
        id: attempt1
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        env:
          CROMAN_APK: dist/app-debug.apk
          CROMAN_TEST_APK: dist/app-debug-androidTest.apk
          CROMAN_LOCALES: ${{ matrix.locales }}
          CROMAN_API: ${{ steps.image.outputs.api }}
          CROMAN_IMAGE_NOTE: ${{ steps.image.outputs.note }}
          CROMAN_RESULTS: device-results
        with:
          api-level: ${{ steps.image.outputs.api }}
          target: ${{ steps.image.outputs.target }}
          arch: x86_64
          cores: 2
          ram-size: 2048
          force-avd-creation: true
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none -no-metrics
          script: bash scripts/emulator-device.sh

      - name: Classify first attempt
        id: first
        if: always()
        run: |
          set -euo pipefail
          if [ "${{ steps.attempt1.outcome }}" = "success" ]; then
            echo "kind=pass" >> "$GITHUB_OUTPUT"
          elif [ -f device-results/status.txt ] && grep -q '^fail:' device-results/status.txt; then
            echo "kind=fail" >> "$GITHUB_OUTPUT"
            cat device-results/status.txt
          else
            echo "kind=infra" >> "$GITHUB_OUTPUT"
            echo "First emulator attempt did not reach a test result. Retrying once."
          fi

      - name: Retry after emulator boot failure
        id: attempt2
        if: always() && steps.first.outputs.kind == 'infra'
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        env:
          CROMAN_APK: dist/app-debug.apk
          CROMAN_TEST_APK: dist/app-debug-androidTest.apk
          CROMAN_LOCALES: ${{ matrix.locales }}
          CROMAN_API: ${{ steps.image.outputs.api }}
          CROMAN_IMAGE_NOTE: ${{ steps.image.outputs.note }}
          CROMAN_RESULTS: device-results
        with:
          api-level: ${{ steps.image.outputs.api }}
          target: ${{ steps.image.outputs.target }}
          arch: x86_64
          cores: 2
          ram-size: 2048
          force-avd-creation: true
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none -no-metrics
          script: bash scripts/emulator-device.sh

      - name: Record emulator outcome
        id: gate
        if: always()
        run: |
          set -euo pipefail
          kind="${{ steps.first.outputs.kind }}"
          mkdir -p device-results
          if [ "$kind" = "pass" ] || [ "${{ steps.attempt2.outcome }}" = "success" ]; then
            echo "block=false" >> "$GITHUB_OUTPUT"
            echo "Emulator ${{ matrix.label }} passed." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$kind" = "fail" ] || { [ -f device-results/status.txt ] && grep -q '^fail:' device-results/status.txt; }; then
            echo "block=true" >> "$GITHUB_OUTPUT"
            echo "Emulator ${{ matrix.label }} failed tests or crashed." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "block=false" >> "$GITHUB_OUTPUT"
          echo "Emulator: not run (boot or infrastructure failed after one retry, requested API ${{ matrix.api }})" | tee device-results/status.txt | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload emulator results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-${{ matrix.label }}
          path: device-results
          retention-days: 7
          if-no-files-found: warn

      - name: Block publishing on a real emulator failure
        if: always() && steps.gate.outputs.block == 'true'
        run: exit 1

  testlab:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: croman-apk
          path: dist

      - name: Firebase Test Lab
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_PROJECT_ID_VAR: ${{ vars.FIREBASE_PROJECT_ID }}
          CROMAN_APK: dist/app-debug.apk
        run: |
          set -euo pipefail
          STATUS="$GITHUB_WORKSPACE/ftl-status.txt"
          SUMMARY="${GITHUB_STEP_SUMMARY:-/dev/null}"
          record() {
            printf '%s\n' "$1" | tee "$STATUS" >> "$SUMMARY"
          }
          finish_skip() {
            record "Test Lab: not run ($1)"
            exit 0
          }
          trap 'rm -f "$RUNNER_TEMP/gcp-sa.json"' EXIT
          PROJECT="${FIREBASE_PROJECT_ID:-${FIREBASE_PROJECT_ID_VAR:-}}"
          if [ -z "${GCP_SA_KEY:-}" ] || [ -z "$PROJECT" ]; then
            finish_skip "secrets GCP_SA_KEY and FIREBASE_PROJECT_ID are not set"
          fi
          echo "$GCP_SA_KEY" > "$RUNNER_TEMP/gcp-sa.json"
          if ! command -v gcloud >/dev/null 2>&1; then
            curl -fsSL https://dl.google.com/dl/cloudsdk/channels/rapid/downloads/google-cloud-cli-linux-x86_64.tar.gz | tar -xz -C "$RUNNER_TEMP"
            export PATH="$RUNNER_TEMP/google-cloud-sdk/bin:$PATH"
          fi
          if ! gcloud auth activate-service-account --key-file="$RUNNER_TEMP/gcp-sa.json" >"$RUNNER_TEMP/ftl-auth.log" 2>&1; then
            cat "$RUNNER_TEMP/ftl-auth.log"
            finish_skip "$(python3 scripts/ftl_outcome.py 1 "$RUNNER_TEMP/ftl-auth.log" | cut -f2-)"
          fi
          if ! gcloud config set project "$PROJECT" >"$RUNNER_TEMP/ftl-project.log" 2>&1; then
            cat "$RUNNER_TEMP/ftl-project.log"
            finish_skip "$(python3 scripts/ftl_outcome.py 1 "$RUNNER_TEMP/ftl-project.log" | cut -f2-)"
          fi
          BUCKET="gs://${PROJECT}-testlab"
          if ! gcloud storage buckets create "$BUCKET" --location=us-central1 --uniform-bucket-level-access --project="$PROJECT" >"$RUNNER_TEMP/ftl-bucket.log" 2>&1; then
            if grep -Eqi 'already exists|HTTPError 409|409:' "$RUNNER_TEMP/ftl-bucket.log"; then
              echo "Results bucket $BUCKET already exists."
            else
              cat "$RUNNER_TEMP/ftl-bucket.log"
              finish_skip "$(python3 scripts/ftl_outcome.py 1 "$RUNNER_TEMP/ftl-bucket.log" | cut -f2-)"
            fi
          else
            echo "Created results bucket $BUCKET."
          fi
          printf '%s\n' '{"rule":[{"action":{"type":"Delete"},"condition":{"age":30}}]}' > "$RUNNER_TEMP/ftl-lifecycle.json"
          if ! gcloud storage buckets update "$BUCKET" --lifecycle-file="$RUNNER_TEMP/ftl-lifecycle.json" >"$RUNNER_TEMP/ftl-lifecycle.log" 2>&1; then
            echo "Could not set the 30-day delete rule. Continuing."
            cat "$RUNNER_TEMP/ftl-lifecycle.log"
          fi
          if ! gcloud firebase test android models list --format=json >"$RUNNER_TEMP/ftl-models.json" 2>"$RUNNER_TEMP/ftl-models.err"; then
            cat "$RUNNER_TEMP/ftl-models.err"
            finish_skip "$(python3 scripts/ftl_outcome.py 1 "$RUNNER_TEMP/ftl-models.err" | cut -f2-)"
          fi
          python3 scripts/ftl-matrix.py "$RUNNER_TEMP/ftl-models.json" | tee -a "$SUMMARY"
          mapfile -t ROBO < "$RUNNER_TEMP/ftl-devices.txt"
          ROBO_ARGS=()
          DEVICES=0
          for device in "${ROBO[@]}"; do
            [ -z "$device" ] && continue
            ROBO_ARGS+=(--device "$device")
            DEVICES=$((DEVICES + 1))
          done
          if [ "$DEVICES" -eq 0 ] || [ "$DEVICES" -gt 9 ]; then
            finish_skip "device matrix had ${DEVICES} runs; the Spark cap for this workflow is 9"
          fi
          APK="${CROMAN_APK}"
          set +e
          gcloud firebase test android run \
            --type robo \
            --app "$APK" \
            "${ROBO_ARGS[@]}" \
            --results-bucket="$BUCKET" \
            --results-dir="${GITHUB_RUN_ID}/robo" \
            --timeout 15m \
            >"$RUNNER_TEMP/ftl-robo.log" 2>&1
          CODE=$?
          set -e
          cat "$RUNNER_TEMP/ftl-robo.log"
          OUTCOME="$(python3 scripts/ftl_outcome.py "$CODE" "$RUNNER_TEMP/ftl-robo.log")"
          KIND="${OUTCOME%%$'\t'*}"
          DETAIL="${OUTCOME#*$'\t'}"
          grep -oE 'https://console\.firebase\.google\.com[^[:space:]]+' "$RUNNER_TEMP/ftl-robo.log" | tr -d '[]' | head -n 1 >> "$SUMMARY" || true
          grep -E 'Passed|Failed|Skipped|Inconclusive|OUTCOME' "$RUNNER_TEMP/ftl-robo.log" >> "$SUMMARY" || true
          if [ "$KIND" = "fail" ]; then
            record "Test Lab: failed (${DETAIL})"
            exit 1
          fi
          if [ "$KIND" = "skip" ]; then
            finish_skip "$DETAIL"
          fi
          record "Test Lab: passed (${DEVICES} virtual devices, results ${BUCKET}/${GITHUB_RUN_ID}/robo)"

      - name: Upload Test Lab status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testlab-status
          path: ftl-status.txt
          retention-days: 7
          if-no-files-found: ignore

  release:
    needs: [build, emulator, testlab]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: croman-apk
          path: dist

      - name: Download emulator results
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: emulator-*
          path: emulator-artifacts

      - name: Download Test Lab status
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: testlab-status
          path: testlab-status

      - name: Prepare release asset
        id: apk
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="v$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)"
          fi
          APP_APK=$(find dist -type f -name 'app-debug.apk' | head -n 1)
          test -n "$APP_APK"
          cp "$APP_APK" "croman-${TAG}.apk"
          SHA="$(sha256sum "croman-${TAG}.apk" | awk '{print $1}')"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
          python3 - <<'PY'
          from pathlib import Path
          lines = []
          root = Path("emulator-artifacts")
          if root.exists():
              for status in sorted(root.rglob("status.txt")):
                  text = status.read_text(encoding="utf-8", errors="replace").strip()
                  if text:
                      lines.append(text)
          Path("emulator-summary.txt").write_text("\n".join(lines) + ("\n" if lines else ""), encoding="utf-8")
          shots = [p for p in root.rglob("*.png") if p.stat().st_size > 0] if root.exists() else []
          preferred = [p for p in shots if any(part in p.name for part in ("home", "settings", "picker", "launch"))]
          chosen = (preferred or shots)[:6]
          out = Path("release-shots")
          out.mkdir(exist_ok=True)
          for index, src in enumerate(chosen, 1):
              (out / f"emulator-{index}-{src.name}").write_bytes(src.read_bytes())
          ftl = next(Path("testlab-status").rglob("ftl-status.txt"), None) if Path("testlab-status").exists() else None
          note = ftl.read_text(encoding="utf-8", errors="replace").strip() if ftl else "Test Lab: not run (no status was recorded)"
          Path("ftl-note.txt").write_text(note + "\n", encoding="utf-8")
          PY

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.apk.outputs.tag }}
          RELEASE_SHA: ${{ steps.apk.outputs.sha }}
        run: |
          set -euo pipefail
          export FTL_NOTE="$(tr '\n' ' ' < ftl-note.txt | sed 's/[[:space:]]*$//')"
          export EMU_NOTE="$(tr '\n' ' ' < emulator-summary.txt | sed 's/[[:space:]]*$//')"
          if [ -z "$EMU_NOTE" ]; then EMU_NOTE="Emulators: no status was recorded"; fi
          NOTES=$(python3 - <<'PY'
          import os
          note = os.environ["FTL_NOTE"]
          emu = os.environ["EMU_NOTE"]
          tag = os.environ["RELEASE_TAG"]
          sha = os.environ["RELEASE_SHA"]
          print(f"""CRoMan {tag} — offline CRM. Signed with a stable test key. This build does not install over 0.2.0 or 0.2.1; uninstall those once. Later builds that use the same key update in place. Mantel CRM 0.1 stays a separate app.

          The APK is debug-signed so the build does not need repository secrets. Android 6.0 or newer. Allow installation from this source, then install.

          SHA-256: {sha}

          Emulators: {emu}

          {note}

          Data stays on the device: no account and no network.

          ---

          CRoMan {tag} — офлайн CRM. Подпись стабильным тестовым ключом. Эта сборка не ставится поверх 0.2.0 и 0.2.1: их нужно удалить один раз. Следующие сборки с тем же ключом обновляются на месте. Версия 0.1 остаётся отдельным приложением.

          APK подписан отладочным ключом, секреты репозитория не нужны. Android 6.0+. Разрешите установку из этого источника.

          SHA-256: {sha}

          Эмуляторы: {emu}

          {note}

          Данные только на устройстве: без аккаунта и без сети.
          """)
          PY
          )
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "croman-${RELEASE_TAG}.apk" --clobber
            gh release edit "$RELEASE_TAG" --notes "$NOTES" --title "$RELEASE_TAG"
          else
            gh release create "$RELEASE_TAG" "croman-${RELEASE_TAG}.apk" \
              --title "$RELEASE_TAG" \
              --notes "$NOTES" \
              --target "${GITHUB_SHA}"
          fi
          if compgen -G "release-shots/*.png" > /dev/null; then
            gh release upload "$RELEASE_TAG" release-shots/*.png --clobber
          fi

      - name: Delete older releases and tags
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.apk.outputs.tag }}
        run: |
          set -euo pipefail
          gh release list --limit 200 --json tagName --jq '.[].tagName' | while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            if [ "$tag" != "$RELEASE_TAG" ]; then
              gh release delete "$tag" --yes --cleanup-tag
            fi
          done
          gh api --paginate "repos/${{ github.repository }}/actions/artifacts?per_page=100" --jq '.artifacts[] | select((.name | startswith("emulator-") or startswith("testlab-")) | not) | .id' | while IFS= read -r id; do
            [ -z "$id" ] && continue
            gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/${id}"
          done
